name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check commit messages
        uses: $/lint-commits

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # actionlint does not know the `$/` self-repository syntax yet, so those two messages are ignored.
      - name: Lint workflows and actions
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color \
            -ignore 'reusable workflow call "\$/' \
            -ignore 'specifying action "\$/'
